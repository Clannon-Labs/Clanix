[package]
name = "clannon"
version = "0.1.0"
edition = "2024"
description = "A tiny interactive environment for inspecting real software execution"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
