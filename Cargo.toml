
[workspace]
resolver = "3"
members = [
    'crates/clanix',
    'crates/clanix-cli',
]

default-members = [
    'crates/clanix',
    'crates/clanix-cli',
]

exclude = [
    "tests",
    "exps"
]

[workspace.package]
rust-version = "1.85"
edition = "2024"
license = "MIT"
repository = "https://github.com/Clannon-Labs/Clanix"
readme = "README.md"

[workspace.dependencies]
# Internal dependencies
clanix = { path = "crates/clanix", version = "0.1.0" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
toml = { version = "1.1.6" }
thiserror = { version = "2.0.21" }
humantime-serde = { version = "1.1.1" }