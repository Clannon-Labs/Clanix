[workspace]
resolver = "3"
members = [
    'crates/libclanix',
    'crates/clanix-cli',
]

default-members = [
    'crates/libclanix',
    'crates/clanix-cli',
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/Clannon-Labs/Clanix"

[workspace.dependencies]
# Internal dependencies
libclanix = { path = "crates/libclanix" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
toml = { version = "1.1.6" }
