# We already have the shorthands set in .cargo/config.toml,
# so just use the shorthands instead of full commands

[tasks.doc]
description = "Generate documentation and copy them to global docs directory"
workspace = false
dependencies = ["build-docs", "copy-docs"]

[tasks.build-docs]
description = "Step 1: Generate the documentation with no external crates"
workspace = false
command = "cargo"
args = ["d"] # shorthand

[tasks.copy-docs]
description = "Step 2: Copy the generated doc to a global docs directory"
workspace = false
script_runner = "@shell"
script = '''
mkdir -p docs

cp -r target/doc/* docs/
'''

[tasks.doc-open]
description = "Open the generated docs without external crates"
workspace = false
command = "cargo"
args = ["op"] # shorthand
