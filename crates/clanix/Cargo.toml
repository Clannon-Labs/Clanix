# Core clanix library
[package]
name = "clanix"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

description = "A lightweight execution and observation library for developer infrastructure."

keywords = ["execution", "observation", "sandbox", "isolation", "developer-tools"]
categories = ["development-tools"]

[lib]
name = "clanix" # Might not be needed but just incase

[dependencies]
# External dependencies
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
humantime-serde.workspace = true

uuid = { version = "1.26.1", features = ["v4", "serde"] }
libc = "0.2.191"
walkdir = "2.5.0"
os_pipe = "1.2.3"
